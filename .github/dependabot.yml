version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Foundry CLI compiles the compendium packs in CI and at release time.
  # A version drift here already broke the build once, so it is worth watching.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  # requirements-dev.txt pins ruff, the Python linter, so CI is reproducible.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
